<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quotation App</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="quotes.jpg" type="image/jpg">
</head>
<body>
  <div class="container">

    <h1>Quotations</h1>
    <p class="subtitle">Allah Iqbal: “Nations are born in the hearts of poets.”</p>

    <div class="new-quote">
      <textarea id="quoteInput" placeholder="Write your quote here..."></textarea>
      <button id="addQuoteBtn">Add Quote</button>
    </div>
   

    <div class="all-quotes-header">
      <span>All Quotes</span>
      <span id="quoteCount" class="quote-count">0 quotes</span>
    </div>

    <div id="quotes" class="quotes-list"></div>
  </div>

<div id="modalOverlay" class="modal-overlay hidden"></div>


<div id="editModal" class="modal hidden">
  <h2><span style="color:#ff6f61;"></span> Edit Quote</h2>
  <textarea id="editTextarea" rows="4" placeholder="Edit your quote..."></textarea>
  <div class="modal-buttons">
    <button id="cancelEdit" class="btn cancel-btn">Cancel</button>
    <button id="saveEdit" class="btn save-btn">Save Changes</button>
  </div>
</div>


<div id="deleteModal" class="modal hidden">
  <h2><span style="color:#ff3c3c;">⚠️</span> Confirm Delete</h2>
  <p>Are you sure you want to delete this quote?</p>
  <div class="modal-buttons">
    <button id="cancelDelete" class="btn cancel-btn">Cancel</button>
    <button id="confirmDelete" class="btn delete-btn">Delete</button>
  </div>
</div>

  <script type="module" src="firebase.js"></script>
</body>
</html>
