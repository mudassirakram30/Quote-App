<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UX Quotes Lab</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/your-kit.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Ambient Orbs -->
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <!-- App Container -->
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <i class="fa-solid fa-lightbulb"></i> UX Quotes Lab
      </div>
      <div class="header-count">Total Quotes: <span id="totalCount">0</span></div>
    </header>

    <!-- Quote Display -->
    <section class="quote-stage">
      <div class="quote-card" id="quoteCard">
        <div class="quote-content">
          <div class="quote-mark">“</div>
          <blockquote id="quoteText">Design is how it works, not how it looks.</blockquote>
          <div class="quote-meta">
            <div class="quote-author" id="quoteAuthor">— Steve Jobs</div>
            <div class="quote-category" id="quoteCategory">UX</div>
          </div>
          <div class="quote-actions">
            <button class="action-btn like-btn" id="likeBtn">
              <i class="fa-solid fa-heart"></i> Like
            </button>
            <button class="action-btn copy-btn" id="copyBtn">
              <i class="fa-solid fa-copy"></i> Copy
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Add Quote Section -->
    <section class="add-section">
      <div class="add-card">
        <div class="add-title">
          <i class="fa-solid fa-plus"></i> Add New Insight
        </div>
        <div class="form-group">
          <textarea id="inputQuote" placeholder="Type your quote here..."></textarea>
        </div>
        <div class="form-row">
          <input type="text" id="inputAuthor" placeholder="Author" />
          <input type="text" id="inputCategory" placeholder="Category" />
        </div>
        <button class="submit-btn" id="addQuoteBtn">Add Quote</button>
      </div>
    </section>

    <!-- Quote List -->
    <section class="list-section">
      <div class="list-header">
        <div class="list-title">
          <i class="fa-solid fa-list"></i> All Quotes
        </div>
      </div>
      <div class="quotes-list" id="quotesList"></div>
    </section>

  </div>

</body>
</html>
