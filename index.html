<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuoteVault — Firebase App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header>
    <h1>QuoteVault</h1>
    <p>Your personal collection of inspiring quotes — powered by Firebase</p>
  </header>

  <main>

    <!-- ── Add / Edit Form ──────────────────────────────────────────────── -->
    <section id="formSection">
      <h2>✦ Add New Quote</h2>
      <div class="form-grid">

        <div>
          <label for="quoteInput">Quote *</label>
          <textarea
            id="quoteInput"
            placeholder="Enter an inspiring quote…"
            rows="3"
          ></textarea>
        </div>

        <div class="form-row">
          <div>
            <label for="authorInput">Author</label>
            <input type="text" id="authorInput" placeholder="e.g. Marcus Aurelius" />
          </div>
          <div>
            <label for="categoryInput">Category</label>
            <select id="categoryInput">
              <option value="Motivation">Motivation</option>
              <option value="Wisdom">Wisdom</option>
              <option value="Life">Life</option>
              <option value="Success">Success</option>
              <option value="Love">Love</option>
              <option value="Philosophy">Philosophy</option>
              <option value="Humor">Humor</option>
              <option value="General">General</option>
            </select>
          </div>
        </div>

        <div class="btn-row">
          <button id="addBtn">Add Quote</button>
          <button id="cancelEditBtn">Cancel</button>
        </div>

      </div>
    </section>

    <!-- ── Random Quote ──────────────────────────────────────────────────── -->
    <section class="random-section">
      <button id="randomBtn">🎲 Random Quote</button>
      <div id="randomDisplay" aria-live="polite"></div>
    </section>

    <!-- ── Quotes List ───────────────────────────────────────────────────── -->
    <section>
      <div class="toolbar">
        <h2>All Quotes</h2>
        <span id="totalCount">0 quotes</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search quotes or authors…"
          aria-label="Search quotes"
        />
        <select id="filterSelect" aria-label="Filter by category">
          <option value="">All Categories</option>
        </select>
      </div>

      <!-- Loading Spinner -->
      <div id="loading">
        <div class="spinner"></div>
        <span>Loading quotes…</span>
      </div>

      <!-- Quotes Grid -->
      <div id="quotesList" role="list" aria-label="Quotes collection"></div>

      <!-- Empty State (inside grid via CSS) -->
      <div id="emptyState" role="status">
        <div class="empty-icon">📜</div>
        <p><strong>No quotes found</strong></p>
        <p>Add your first quote above or try a different search.</p>
      </div>
    </section>

  </main>

  <!-- ── Toast Notification ───────────────────────────────────────────────── -->
  <div id="toast" role="alert" aria-live="assertive"></div>

  <!-- ── Scripts (type=module for ES imports) ─────────────────────────────── -->
  <script type="module" src="app.js"></script>

</body>
</html>
